# This repository's FreeANDIY settings (branding.toml is shared by all FreeANDIY repositories).
# Modified-by: FreeANDIY (Free Andy Agency), 2026. New file, not part of upstream GridCraft.

app = "sheets" # which [apps.<id>] entry of branding.toml this repository builds

[build]
# cargo arguments for the release binaries, the tests sync-upstream.sh runs, and the web page.
bins = "-p gridcraft -p gridcraft-cli"
features = ""
tests = "-p gridcraft-ui-egui -p gridcraft-engine -p gridcraft -p gridcraft-cli"
web_index = "apps/gridcraft-web/index.html"
test_env = ""
web_env = ""
# Upstream's ci.yml runs `cargo xtask ci` (fmt, clippy, tests, assets).
ci_tests = "false"

[check]
# check-branding.sh: extra allowed strings (regex) and Rust paths where the upstream name may stay
# in string literals (git pathspecs, space-separated).
allow = ""
rs_exclude = ":!xtask/**"
